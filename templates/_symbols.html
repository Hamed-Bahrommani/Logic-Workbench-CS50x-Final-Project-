<div id="symbols" class="symbols" hidden aria-label="Insert a symbol">
    <button type="button" data-insert="¬" aria-label="not">¬</button>
    <button type="button" data-insert="∧" aria-label="and">∧</button>
    <button type="button" data-insert="∨" aria-label="or">∨</button>
    <button type="button" data-insert="→" aria-label="implies">→</button>
    <button type="button" data-insert="↔" aria-label="if and only if">↔</button>
    <button type="button" data-insert="⊥" aria-label="falsum">⊥</button>
    <button type="button" data-insert="(" aria-label="open parenthesis">(</button>
    <button type="button" data-insert=")" aria-label="close parenthesis">)</button>
</div>

<p class="hint">
    You can also type <code>~</code> <code>&amp;</code> <code>|</code>
    <code>-&gt;</code> <code>&lt;-&gt;</code> <code>_|_</code>
    for ¬ ∧ ∨ → ↔ ⊥. Variables are names like <code>P</code> or <code>rain</code>;
    <code>T</code> and <code>F</code> are reserved.
</p>
