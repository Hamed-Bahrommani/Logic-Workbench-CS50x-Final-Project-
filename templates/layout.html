<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Logic Workbench{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <h1><a href="{{ url_for('index') }}">Logic Workbench</a></h1>
        <p>A learning environment for propositional logic</p>
    </header>
    <nav class="site-nav" aria-label="Tools">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Truth table</a>
        <a href="{{ url_for('equivalence') }}"{% if request.endpoint == 'equivalence' %} aria-current="page"{% endif %}>Equivalence</a>
        <a href="{{ url_for('argument') }}"{% if request.endpoint == 'argument' %} aria-current="page"{% endif %}>Argument</a>
        <a href="{{ url_for('normal_form') }}"{% if request.endpoint == 'normal_form' %} aria-current="page"{% endif %}>Normal forms</a>
        <a href="{{ url_for('proof_checker') }}"{% if request.endpoint == 'proof_checker' %} aria-current="page"{% endif %}>Proof checker</a>
        <a href="{{ url_for('exercise_list') }}"{% if request.endpoint in ('exercise_list', 'exercise_page', 'submit_exercise') %} aria-current="page"{% endif %}>Exercises</a>
    </nav>
    <main>
        {% block main %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
